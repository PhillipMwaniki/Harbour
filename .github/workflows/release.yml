# Builds installers for every platform and attaches them to a draft GitHub
# release. Pushing a tag is the only trigger that matters:
#
#   git tag v0.2.0 && git push origin v0.2.0
#
# The release is created as a *draft* so a human reads the notes and clicks
# Publish. Nothing here can put an installer in front of users on its own.
#
# What has to be true for a tag to release, checked in `verify` before a
# single compiler runs:
#   - the tag is vX.Y.Z (a -suffix marks a pre-release);
#   - package.json, src-tauri/tauri.conf.json and src-tauri/Cargo.toml all
#     carry X.Y.Z;
#   - CHANGELOG.md has a `## [X.Y.Z]` section, which becomes the release body.
#
# See docs/releasing.md for the process around this file.
name: Release

on:
  push:
    tags: ["v*"]
  # For rerunning a failed release from the Actions tab. It runs on the ref
  # you pick, and `verify` refuses anything that is not a version tag.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: The tag and every version field agree
        id: version
        run: node scripts/check-version.mjs "${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"

      - name: The changelog has an entry for it
        id: notes
        run: |
          {
            echo "notes<<HARBOUR_NOTES_EOF"
            node scripts/release-notes.mjs "${{ steps.version.outputs.version }}"
            echo "HARBOUR_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

  # The same gate CI applies to every pull request. A tag that does not pass
  # it does not ship.
  test:
    name: Test (${{ matrix.os }})
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec vite build
      - name: Format
        working-directory: src-tauri
        run: cargo fmt --all --check
      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        working-directory: src-tauri
        run: cargo test --all-features

  build:
    name: Build (${{ matrix.name }})
    needs: [verify, test]
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing must not cancel the others: a partial set of
      # installers on a draft is easier to finish than none.
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          - name: macOS Apple silicon
            os: macos-latest
            target: aarch64-apple-darwin
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            os: macos-latest
            target: x86_64-apple-darwin
            args: --target x86_64-apple-darwin
          - name: Linux x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.target }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Signed updater artifacts (.sig files and latest.json) are produced only
      # for releases, so CI can build without the signing secret. This turns
      # them on just for this build; the signing itself needs the secrets in
      # the tauri-action env below.
      - name: Enable updater artifacts
        shell: bash
        run: >
          node -e "const f='src-tauri/tauri.conf.json';
          const c=require('./'+f);
          c.bundle.createUpdaterArtifacts=true;
          require('fs').writeFileSync(f, JSON.stringify(c,null,2)+String.fromCharCode(10));"

      # Builds the app and its installers, creates the draft release on the
      # first platform to finish, and attaches each platform's bundles to it.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater signing, for the milestone 9 auto-update. Empty until the
          # secrets exist, and harmless while they do not: unsigned bundles
          # are still produced, and no `.sig` files are.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v${{ needs.verify.outputs.version }}
          releaseName: Harbour ${{ needs.verify.outputs.version }}
          releaseBody: ${{ needs.verify.outputs.notes }}
          releaseDraft: true
          includeUpdaterJson: true
          prerelease: ${{ needs.verify.outputs.prerelease == 'true' }}
          args: ${{ matrix.args }}

  # One SHA256SUMS file for everything on the release, so a downloaded
  # installer can be checked against what the pipeline produced. Runs after
  # every platform has uploaded, whether or not they all succeeded.
  checksums:
    name: Checksums
    needs: [verify, build]
    if: always() && needs.verify.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Download every asset on the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir assets
          gh release download "v${{ needs.verify.outputs.version }}" \
            --repo "${GITHUB_REPOSITORY}" --dir assets
          ls -l assets

      - name: Write and attach SHA256SUMS
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd assets
          rm -f SHA256SUMS
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
          gh release upload "v${{ needs.verify.outputs.version }}" SHA256SUMS \
            --repo "${GITHUB_REPOSITORY}" --clobber
