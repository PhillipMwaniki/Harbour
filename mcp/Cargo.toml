[package]
name = "harbour-mcp"
version = "0.6.0"
description = "Model Context Protocol server exposing Harbour's saved hosts to AI agents"
authors = ["Harbour contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.82"

[[bin]]
name = "harbour-mcp"
path = "src/main.rs"

[lib]
name = "harbour_mcp"
path = "src/lib.rs"

[dependencies]
# The Tauri-free core: vault, ssh, secrets, known_hosts. `default-features =
# false` drops the `app` feature, so none of Tauri is linked into this binary.
harbour = { path = "../src-tauri", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# For SFTP reads/writes of non-text files, matching the core's base64 choice.
data-encoding = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util", "sync"] }
dirs = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
