[package]
name = "harbour"
version = "0.5.0"
description = "Cross-platform SSH client, terminal and SFTP file manager"
authors = ["Harbour contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.82"

# The library is what integration tests and the mobile targets link against;
# `harbour_lib` avoids a name clash with the Windows executable.
[lib]
name = "harbour_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri and its plugins are the app half; they are optional so the headless
# reuse of this crate (the MCP server) can link the core without the webview
# stack. The `app` feature, on by default, turns them on for the desktop build.
tauri = { version = "2", features = [], optional = true }
tauri-plugin-opener = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "fs", "io-util"] }
portable-pty = "0.9"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
# `ring` rather than the default `aws-lc-rs` backend: aws-lc-sys needs NASM on
# Windows, which would put a C toolchain in front of anyone cloning the repo -
# and in front of CI - for no functional gain.
russh = { version = "0.63", default-features = false, features = ["ring", "flate2", "rsa"] }
dirs = "6"
# Lists installed font families for the settings dialog. Pure Rust: it walks
# the platform font directories itself rather than binding a system library.
fontdb = "0.24"
hmac = "0.13"
sha1 = "0.11"
data-encoding = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
keyring = "4"
zip = { version = "5.0.1", default-features = false, features = ["deflate"] }
russh-sftp = "2.4.0"
notify = "8"
tauri-plugin-updater = { version = "2.11.0", optional = true }
tauri-plugin-process = { version = "2.3.1", optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
argon2 = "0.5"
chacha20poly1305 = "0.10"
serialport = "4"
zeroize = "1"
getrandom = "0.3"
# A CSPRNG for generating SSH keypairs; also used by the integration tests.
rand = "0.10"

[features]
default = ["app"]
# The desktop app: Tauri, its plugins, and the command/IPC layer that drives
# the webview. Off for a headless consumer of the core (the MCP server).
app = [
    "dep:tauri",
    "dep:tauri-plugin-opener",
    "dep:tauri-plugin-updater",
    "dep:tauri-plugin-process",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-notification",
]
# Enables the webview devtools in release builds; off by default. Implies the
# app, since there is no webview to inspect without it.
devtools = ["app", "tauri/devtools"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# Deliberately *not* panic = "abort": a panicking session task must be
# containable (see docs/architecture.md), not fatal to the whole app.
strip = true
