[package]
name = "harbour"
version = "0.3.0"
description = "Cross-platform SSH client, terminal and SFTP file manager"
authors = ["Harbour contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.82"

# The library is what integration tests and the mobile targets link against;
# `harbour_lib` avoids a name clash with the Windows executable.
[lib]
name = "harbour_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "fs", "io-util"] }
portable-pty = "0.9"
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
# `ring` rather than the default `aws-lc-rs` backend: aws-lc-sys needs NASM on
# Windows, which would put a C toolchain in front of anyone cloning the repo -
# and in front of CI - for no functional gain.
russh = { version = "0.63", default-features = false, features = ["ring", "flate2", "rsa"] }
dirs = "6"
hmac = "0.13"
sha1 = "0.11"
data-encoding = "2"
rusqlite = { version = "0.40", features = ["bundled"] }
keyring = "4"
zip = { version = "5.0.1", default-features = false, features = ["deflate"] }
russh-sftp = "2.4.0"
notify = "8"
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2.3.1"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
argon2 = "0.5"
chacha20poly1305 = "0.10"
zeroize = "1"
getrandom = "0.3"

[dev-dependencies]
# The SSH integration tests stand up a real russh server, which needs a key.
rand = "0.10"

[features]
# Enables the webview devtools in release builds; off by default.
devtools = ["tauri/devtools"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# Deliberately *not* panic = "abort": a panicking session task must be
# containable (see docs/architecture.md), not fatal to the whole app.
strip = true
